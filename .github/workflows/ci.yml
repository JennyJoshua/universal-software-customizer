name: CI

on:
  push:
    branches: [main, 'usc-verify/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r constraints.lock
      - name: Install project without re-resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
