name: USC Live Docker Validation

on:
  push:
    branches: [main]
    paths:
      - "engine/customizer/build_runner.py"
      - "engine/customizer/build_approval.py"
      - "engine/customizer/build_evidence.py"
      - "engine/customizer/schemas/build-evidence.schema.json"
      - ".github/workflows/docker-live-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usc-live-docker-validation
  cancel-in-progress: true

jobs:
  live-docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install USC and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Docker daemon and pre-provision a pinned test image
        id: image
        run: |
          docker info
          docker pull python:3.12-slim
          IMAGE="$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          if [[ ! "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the pulled test image to a sha256 digest."
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Verify bounded tmpfs volume survives container exit for safe export
        env:
          USC_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          VOLUME="usc-volume-probe-${GITHUB_RUN_ID}"
          CONTAINER="usc-volume-probe-${GITHUB_RUN_ID}"
          OUTPUT="$RUNNER_TEMP/usc-volume-probe"
          cleanup() {
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker volume rm -f "$VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$OUTPUT"
          docker volume create --driver local \\
            --opt type=tmpfs --opt device=tmpfs \\
            --opt "o=size=16m,uid=$(id -u),gid=$(id -g),mode=0700" \\
            --label com.usc.test=volume-export "$VOLUME"
          docker create --name "$CONTAINER" \\
            --user="$(id -u):$(id -g)" \\
            --mount "type=volume,src=$VOLUME,dst=/out" \\
            --entrypoint python "$USC_TEST_IMAGE" \\
            -c "from pathlib import Path; Path('/out/probe.txt').write_text('tmpfs volume survived stop\\\\n')"
          docker start -a "$CONTAINER"
          docker cp "$CONTAINER:/out/." "$OUTPUT"
          test "$(cat "$OUTPUT/probe.txt")" = "tmpfs volume survived stop"
          echo "Named tmpfs volume data remains exportable after container exit."

      - name: Create a clean synthetic Git fixture
        run: |
          FIXTURE="$RUNNER_TEMP/usc-docker-fixture"
          mkdir -p "$FIXTURE"
          git -C "$FIXTURE" init -q
          git -C "$FIXTURE" config user.name "USC Docker Validation"
          git -C "$FIXTURE" config user.email "usc-docker-validation@example.invalid"
          printf 'USC docker smoke fixture\n' > "$FIXTURE/fixture.txt"
          git -C "$FIXTURE" add fixture.txt
          git -C "$FIXTURE" commit -qm "synthetic Docker smoke fixture"
          mkdir -p "$RUNNER_TEMP/usc-docker-artifacts"
          echo "FIXTURE=$FIXTURE" >> "$GITHUB_ENV"

      - name: Create, explicitly approve, and execute the isolated smoke profile
        env:
          USC_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          usc build-request \
            --path "$FIXTURE" \
            --image "$USC_TEST_IMAGE" \
            --profile python-container-smoke \
            --timeout 60 --expires-in 600 \
            --output "$RUNNER_TEMP/build-request.json"
          usc build-approve \
            --request "$RUNNER_TEMP/build-request.json" \
            --output "$RUNNER_TEMP/build-approval.json" \
            --approve
          usc build-run \
            --approval "$RUNNER_TEMP/build-approval.json" \
            --path "$FIXTURE" \
            --output-dir "$RUNNER_TEMP/usc-docker-artifacts" \
            --report "$RUNNER_TEMP/build-evidence.json"

      - name: Verify live Docker evidence, exported artifact, and cleanup
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((temp / "build-evidence.json").read_text())
          print("Build evidence:", json.dumps(report, indent=2))
          artifact_dir = temp / "usc-docker-artifacts"
          print("Exported filesystem entries:", [str(path.relative_to(artifact_dir)) for path in artifact_dir.rglob("*")])
          assert report["status"] == "passed", report
          assert report["executed"] is True
          assert report["source_read_only"] is True
          assert report["network_disabled"] is True
          assert report["container_cleanup_confirmed"] is True
          assert report["artifact_exported"] is True
          assert report["source_git_commit_sha"]
          assert report["source_git_tree_sha"]
          assert report["toolchain_inventory_sha256"]
          artifact = temp / "usc-docker-artifacts" / "smoke-result.txt"
          assert artifact.read_text() == "isolated runner passed\n"
          print("Live Docker validation passed:", report["docker_engine_version"])
          PY
          if [[ -n "$(docker ps -aq --filter 'label=com.usc.build-run')" ]]; then
            echo "A labelled USC build container remains after the run."
            exit 1
          fi
          test -z "$(git -C "$FIXTURE" status --porcelain)"
