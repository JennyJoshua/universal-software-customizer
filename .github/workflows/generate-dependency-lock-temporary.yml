name: Generate dependency lock (temporary)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - security/dependency-lock-generation

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned lock-generation tool
        run: python -m pip install "pip-tools==7.6.1"
      - name: Generate complete hash-locked dependency set
        run: |
          python -m piptools compile \
            --generate-hashes \
            --allow-unsafe \
            --all-build-deps \
            --all-extras \
            --resolver=backtracking \
            --output-file=constraints.lock \
            pyproject.toml
      - name: Verify hash-enforced installation and project tests
        run: |
          python -m pip install --require-hashes -r constraints.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest -q
      - name: Emit lockfile for maintainer review
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = Path("constraints.lock").read_bytes()
          encoded = base64.b64encode(data).decode("ascii")
          print("LOCKFILE_BASE64_BEGIN")
          for offset in range(0, len(encoded), 76):
              print(encoded[offset:offset + 76])
          print("LOCKFILE_BASE64_END")
          print(f"LOCKFILE_BYTES={len(data)}")
          PY
