[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-software-customizer"
version = "0.1.0"
description = "A safe, licence-aware framework for customizing eligible open-source software."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Project Maintainers" }]
dependencies = ["jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
usc = "customizer.cli:main"
usc-runner-broker = "customizer.local_runner_broker:main"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
customizer = ["schemas/*.json"]
